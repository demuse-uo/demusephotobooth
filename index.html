<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Photobooth | deMuse</title>

  <!-- Font dari Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Unbounded:wght@700;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app">

    <!-- ===== BAR ATAS ===== -->
    <header class="topbar">
      <!-- ganti href dengan alamat website utama deMuse -->
      <a href="../index.html" class="ikon-btn" title="Kembali">←</a>
      <h1>deMuse Photobooth</h1>
      <div class="topbar-kanan">
        <button id="btnUndo" class="ikon-btn" title="Undo (kembali)" disabled>↶</button>
        <button id="btnRedo" class="ikon-btn" title="Redo (maju)" disabled>↷</button>
        <button id="btnDownload" class="ikon-btn utama" title="Simpan" disabled>⬇</button>
      </div>
    </header>

    <!-- ===== HASIL (ATAS) ===== -->
    <main class="stage" id="stage">
      <div class="canvas-wrap" id="canvasWrap">
        <canvas id="canvas"></canvas>

        <!-- Kotak putus-putus di tulisan / foto yang dipilih -->
        <div class="sorot" id="sorot"></div>

        <!-- Kamera tampil di atas hasil saat dibuka -->
        <video id="camera" autoplay playsinline muted></video>
        <div class="kamera-alat" id="kameraAlat">
          <button id="btnBalik" class="chip" title="Ganti kamera">🔄</button>
          <button id="btnTutupKamera" class="chip" title="Tutup kamera">✕</button>
        </div>
        <div class="hitung" id="hitung"></div>
      </div>
    </main>

    <p class="tip" id="tip">Ketuk tulisan untuk edit · Ketuk foto untuk geser & zoom</p>

    <!-- ===== ALAT (BAWAH) ===== -->
    <section class="dock">

      <div class="panel-isi">

        <!-- Bingkai -->
        <div class="panel" data-panel="bingkai">
          <div class="baris-geser" id="frameList"></div>
        </div>

        <!-- Foto -->
        <div class="panel" data-panel="foto">
          <div class="shutter-baris">
            <label class="bulat" title="Ambil dari album">
              🖼️
              <input type="file" id="fileInput" accept="image/*" multiple hidden>
            </label>
            <button id="btnShutter" class="shutter" title="Kamera"></button>
            <button id="btnReset" class="bulat" title="Hapus semua foto">↺</button>
          </div>
          <p class="info"><b id="count">0</b>/<span id="max">3</span> foto · <span id="infoFoto">ketuk tombol bulat untuk buka kamera</span></p>
        </div>

        <!-- Filter -->
        <div class="panel" data-panel="filter">
          <div class="baris-geser" id="filterList"></div>
        </div>

        <!-- Pilihan tulisan logo -->
        <div class="panel" data-panel="logo">
          <div class="baris-geser" id="logoList"></div>
        </div>

        <!-- Edit tulisan (muncul saat tulisan diketuk) -->
        <div class="panel" data-panel="teks">
          <div class="baris">
            <textarea id="editorTeks" rows="2"></textarea>
            <button id="btnSelesai" class="kotak hijau" title="Selesai">✓</button>
          </div>
          <div class="baris">
            <select id="editorFont">
              <option value="Inter">Inter</option>
              <option value="Horizon">Horizon</option>
              <option value="Unbounded">Unbounded</option>
              <option value="Mallica">Mallica Fairytale</option>
              <option value="Bubblegum">Bubblegum</option>
              <option value='"Anak Manja"'>Anak Manja</option>
              <option value='"Kopi Senja"'>Kopi Senja Sans</option>
              <option value='"Kopi Senja Script"'>Kopi Senja Script</option>
              <option value='"Playfair Display"'>Playfair Display</option>
              <option value='italic|"Playfair Display"'>Playfair Display Italic</option>
            </select>
            <button id="btnKecil" class="kotak" title="Perkecil">A−</button>
            <button id="btnBesar" class="kotak" title="Perbesar">A+</button>
          </div>
          <div class="baris-geser warna-baris" id="editorWarna">
            <label class="warna-bebas" title="Warna lain">
              🎨
              <input type="color" id="warnaBebas">
            </label>
          </div>
        </div>

        <!-- Atur foto (muncul saat foto diketuk) -->
        <div class="panel" data-panel="atur">
          <div class="baris">
            <span class="label-zoom">🔍</span>
            <input type="range" id="zoomFoto" min="1" max="3" step="0.01" value="1">
            <button id="btnSelesaiFoto" class="kotak hijau" title="Selesai">✓</button>
          </div>
          <div class="baris">
            <button id="btnGantiFoto" class="pil">🖼️ Ganti foto</button>
            <button id="btnResetFoto" class="pil">↺ Posisi awal</button>
          </div>
          <p class="info">Geser foto di gambar · cubit dua jari untuk zoom</p>
          <input type="file" id="gantiInput" accept="image/*" hidden>
        </div>

      </div>

      <!-- Tab bawah -->
      <nav class="tabs">
        <button data-tab="bingkai"><span class="ikon">🖼️</span>Bingkai</button>
        <button data-tab="foto"><span class="ikon">📷</span>Foto</button>
        <button data-tab="filter"><span class="ikon">✨</span>Filter</button>
        <button data-tab="logo" id="tabLogo"><span class="ikon">🔤</span>Logo</button>
      </nav>

    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
